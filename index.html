<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện Thi CLC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f52ba'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3ECLC%3C/text%3E%3C/svg%3E">
<meta name="description"content="Ôn luyện và thi thử vào lớp Chất Lượng Cao: trắc nghiệm theo môn, thi thử có tính giờ, thống kê điểm, nhập đề từ Excel/Word.">
<meta name="theme-color" content="#0f52ba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bảng màu xanh – trắng (theo "Monochromatic Color Palette" #002B8C): Oceanic Azure #002B8C, Dusk Blue #3E5D8E, Sapphire #0F52BA, Azure #F0FFFF, Indigo Blue #282888 */
:root{
  --nen:#f3f7fe; --the:#ffffff; --chu:#0c1a3d; --phu:#3e5d8e; --vien:#d3dff2;
  --nhan:#0f52ba; --nhan-dam:#002b8c; --nhan-nhat:#e4eefc; --tren-nhan:#ffffff;
  --dung:#1a7f4b; --dung-nen:#e0f4e8; --sai:#c0392b; --sai-nen:#fbe4e1;
  --vang:#9a6a12; --vang-nen:#fdf0d5;
  --bong:0 1px 2px rgba(0,43,140,.07),0 6px 18px rgba(0,43,140,.07);
  --bk:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --nen:#0a1330; --the:#111d45; --chu:#e7eefc; --phu:#9db4dc; --vien:#25396a;
    --nhan:#6ea3f5; --nhan-dam:#a9c8fa; --nhan-nhat:#18295a; --tren-nhan:#06122e;
    --dung:#5fd08f; --dung-nen:#17382f; --sai:#ff8a7a; --sai-nen:#3d1f2a;
    --vang:#e5b85c; --vang-nen:#3a3017;
    --bong:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  }
}
/* Mục TIMO dùng Indigo Blue (#282888) để phân biệt với mục CLC (Sapphire #0F52BA) */
:root[data-bo=timo]{--nhan:#282888;--nhan-dam:#1a1a66;--nhan-nhat:#e7e7f8;--tren-nhan:#ffffff}
@media (prefers-color-scheme:dark){
  :root[data-bo=timo]{--nhan:#9d9df2;--nhan-dam:#c6c6f8;--nhan-nhat:#22224f;--tren-nhan:#10103a}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--nen);color:var(--chu);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.3;margin:0}
p{margin:.4em 0}
a{color:var(--nhan)}

/* Banner: dải xanh đậm có nền giấy kẻ ô, bên phải là phiếu trả lời (CLC) hoặc hình học (TIMO); thanh chức năng dính phía dưới */
:root{--b1:#002b8c;--b2:#0f52ba;--b3:#3d86e6}
:root[data-bo=timo]{--b1:#12124a;--b2:#282888;--b3:#4a4ac2}
.banner{position:relative;overflow:hidden;color:#fff;background:linear-gradient(118deg,var(--b1) 0%,var(--b2) 56%,var(--b3) 100%)}
.banner::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.085) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,rgba(255,255,255,.085) 1px,transparent 1px) 0 0/26px 26px;
  -webkit-mask-image:linear-gradient(100deg,transparent 22%,#000 88%);mask-image:linear-gradient(100deg,transparent 22%,#000 88%)}
.banner::after{content:"";position:absolute;right:-110px;top:-150px;width:420px;height:420px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 66%)}
.banner__trong{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:28px 16px 26px;display:flex;align-items:center;justify-content:space-between;gap:28px}
.banner__chu{display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-width:0}
.thuong-hieu{display:flex;align-items:center;gap:16px;min-width:0}
.thuong-hieu b{flex:none;display:inline-grid;place-items:center;min-width:66px;height:66px;padding:0 12px;border-radius:19px;background:#fff;color:var(--b2);font-size:1.2rem;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 24px rgba(0,16,70,.32)}
.banner__ten{display:block;font-size:2.05rem;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.banner__mota{margin:7px 0 0;max-width:36ch;text-wrap:balance;font-size:.98rem;font-weight:500;line-height:1.45;color:rgba(255,255,255,.86)}
.bo-de{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32)}
.bo-de button{border:0;background:none;padding:6px 18px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.88rem;letter-spacing:.02em;color:#fff}
.bo-de button:hover{background:rgba(255,255,255,.16)}
.bo-de button[aria-pressed=true]{background:#fff;color:var(--b2)}
.bo-de button:focus-visible,.menu button:focus-visible{outline:3px solid #9cc4ff;outline-offset:2px}
.banner__hinh{flex:none;width:300px;margin-right:4px}
.banner__hinh svg{display:none;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,16,70,.38))}
:root:not([data-bo=timo]) .banner__hinh .hinh-clc{display:block}
:root[data-bo=timo] .banner__hinh .hinh-timo{display:block}
.chon-c{animation:to-bong .55s .45s both}
.chon-c-chu{animation:doi-chu .55s .45s both}
@keyframes to-bong{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes doi-chu{from{fill:#fff}to{fill:var(--b2)}}
@media (prefers-reduced-motion:reduce){.chon-c,.chon-c-chu{animation:none}}
@media (max-width:700px){
  .banner__hinh{display:none}
  .banner__trong{padding:20px 16px 18px}
  .thuong-hieu b{min-width:54px;height:54px;border-radius:16px;font-size:1rem}
  .banner__ten{font-size:1.55rem}
  .banner__mota{font-size:.9rem}
}
.thanh-menu{position:sticky;top:0;z-index:20;background:var(--the);border-bottom:1px solid var(--vien);box-shadow:0 6px 16px rgba(0,43,140,.06)}
.menu{max-width:920px;margin:0 auto;padding:7px 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{background:none;border:0;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--phu);font-weight:500;white-space:nowrap}
.menu button:hover{background:var(--nhan-nhat);color:var(--nhan-dam)}
.menu button[aria-current=page]{background:var(--nhan-nhat);color:var(--nhan-dam);font-weight:700}

/* Khung 3 cột: hai bên là "sổ ghi chú" công thức Toán, Lý, Hóa và hình Tin học (chỉ hiện khi màn hình đủ rộng), giữa là nội dung */
.khung{flex:1 0 auto;display:flex;justify-content:center;align-items:flex-start;width:100%}
main{flex:0 1 920px;min-width:0;max-width:920px;margin:0;padding:20px 16px 48px}
.canh{display:none}
@media (min-width:1280px){
  .canh{display:flex;flex:1 1 0;min-width:0;max-width:280px;flex-direction:column;gap:30px;padding:34px 14px 40px;position:sticky;top:66px;pointer-events:none;user-select:none}
}
.canh svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 16px rgba(0,43,140,.1))}
.canh svg:nth-child(odd){transform:rotate(-1.8deg)}
.canh svg:nth-child(even){transform:rotate(1.5deg)}
.canh .the{fill:var(--the);stroke:var(--vien);stroke-width:1.2}
.canh .net{fill:none;stroke:var(--nhan);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.canh .mong{fill:none;stroke:var(--phu);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.canh .nen-nhat{fill:var(--nhan-nhat);stroke:none}
.canh .dac{fill:var(--nhan);stroke:none}
.canh text{fill:var(--chu);font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif}
.canh .nhan{fill:var(--phu);font-size:13px;font-style:italic}
.canh .lon{font-size:25px}
.canh .vua{font-size:19px}
.canh .ma{font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-size:11.5px}
.canh .tu{fill:var(--nhan);font-weight:700}
.canh .chuoi{fill:var(--phu)}
.chan-trang{flex:none;width:100%;max-width:920px;margin:0 auto;padding:20px 16px 32px;border-top:1px solid var(--vien);color:var(--phu);font-size:.85rem;text-align:center}
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--bk);padding:18px;margin:0 0 16px;box-shadow:var(--bong)}
.tieu-de{margin:4px 0 16px}
.tieu-de h1{font-size:1.5rem;letter-spacing:-.01em}
.tieu-de p{color:var(--phu)}
.luoi{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.so-lieu{background:var(--the);border:1px solid var(--vien);border-radius:var(--bk);padding:14px 16px}
.so-lieu b{display:block;font-size:1.6rem;line-height:1.2;letter-spacing:-.02em}
.so-lieu span{color:var(--phu);font-size:.875rem}
.hanh-dong{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;cursor:pointer;background:var(--the);border:1px solid var(--vien);border-radius:var(--bk);padding:16px;box-shadow:var(--bong);transition:border-color .15s,transform .15s}
.hanh-dong:hover{border-color:var(--nhan);transform:translateY(-1px)}
.hanh-dong strong{font-size:1.05rem}
.hanh-dong span{color:var(--phu);font-size:.9rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:1px solid var(--nhan);background:var(--nhan);color:var(--tren-nhan);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--nhan-dam);border-color:var(--nhan-dam)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.vien{background:transparent;color:var(--nhan-dam);border-color:var(--vien)}
.btn.vien:hover{border-color:var(--nhan);background:var(--nhan-nhat)}
.btn.nguy{background:transparent;color:var(--sai);border-color:var(--vien)}
.btn.nguy:hover{border-color:var(--sai);background:var(--sai-nen)}
.btn.nho{padding:6px 12px;font-size:.875rem;border-radius:8px}
.hang{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hang.giua{justify-content:space-between}
.co-gian{flex:1}

.truong{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.truong label,.nhan{font-weight:600;font-size:.9rem}
.truong small{color:var(--phu)}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--vien);background:var(--nen)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--nhan);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
.chon-mon{display:flex;flex-wrap:wrap;gap:8px}
.chon-mon label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--vien);border-radius:999px;cursor:pointer;font-weight:500;font-size:.9rem}
.chon-mon input{accent-color:var(--nhan)}
.chon-mon label:has(input:checked){background:var(--nhan-nhat);border-color:var(--nhan);color:var(--nhan-dam)}
.hai-cot{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.hai-cot{grid-template-columns:1fr}}

.meta{color:var(--phu);font-size:.85rem;margin-bottom:6px}
.cau-nd{font-size:1.1rem;font-weight:600;white-space:pre-wrap;margin:4px 0 14px}
.dap-an{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:0 0 10px;border:1px solid var(--vien);border-radius:12px;background:var(--the);cursor:pointer}
.dap-an:hover:not(:disabled){border-color:var(--nhan)}
.dap-an .chu-cai{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--nhan-nhat);color:var(--nhan-dam)}
.dap-an.chon{border-color:var(--nhan);background:var(--nhan-nhat)}
.dap-an.chon .chu-cai{background:var(--nhan);color:var(--tren-nhan)}
.dap-an.dung{border-color:var(--dung);background:var(--dung-nen)}
.dap-an.dung .chu-cai{background:var(--dung);color:var(--the)}
.dap-an.sai{border-color:var(--sai);background:var(--sai-nen)}
.dap-an.sai .chu-cai{background:var(--sai);color:var(--the)}
.dap-an:disabled{cursor:default}
.dap-an span.nd{white-space:pre-wrap;padding-top:2px}
.dien-hang{flex-wrap:nowrap;margin:0 0 10px}
.o-dien{font-size:1.1rem;font-weight:600}
.dien-hang .o-dien{flex:1;min-width:0}
.o-dien.dung{border-color:var(--dung);background:var(--dung-nen)}
.o-dien.sai{border-color:var(--sai);background:var(--sai-nen)}
.giai-thich{border-radius:12px;padding:12px 14px;margin:6px 0 14px;background:var(--vang-nen);color:var(--chu);white-space:pre-wrap}
.giai-thich b{color:var(--vang)}
.phan-hoi{font-weight:700;margin:4px 0}
.phan-hoi.dung{color:var(--dung)} .phan-hoi.sai{color:var(--sai)}

.tien-do{height:8px;border-radius:99px;background:var(--vien);overflow:hidden;margin:0 0 14px}
.tien-do i{display:block;height:100%;background:var(--nhan);transition:width .25s}
.thanh-thi{position:sticky;top:62px;z-index:10;display:flex;align-items:center;gap:14px;background:var(--the);border:1px solid var(--vien);border-radius:var(--bk);padding:10px 14px;margin:0 0 16px;box-shadow:var(--bong)}
.dong-ho{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.4rem;color:var(--nhan-dam)}
.dong-ho.gap{color:var(--sai)}
.luoi-cau{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.luoi-cau button{height:40px;border-radius:9px;border:1px solid var(--vien);background:var(--the);cursor:pointer;font-weight:600;position:relative}
.luoi-cau button.da{background:var(--nhan-nhat);border-color:var(--nhan)}
.luoi-cau button.hien{outline:2px solid var(--nhan);outline-offset:1px}
.luoi-cau button.dau::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--vang)}
.chu-giai{display:flex;gap:14px;flex-wrap:wrap;color:var(--phu);font-size:.8rem;margin-top:10px}

.diem-lon{font-size:3.2rem;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--nhan-dam)}
.diem-lon small{font-size:1.1rem;color:var(--phu);font-weight:500}
.thanh{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.thanh .nen{height:10px;border-radius:99px;background:var(--vien);overflow:hidden}
.thanh .nen i{display:block;height:100%;background:var(--nhan)}
.thanh output{text-align:right;color:var(--phu);font-variant-numeric:tabular-nums}
.bieu-do{display:flex;align-items:flex-end;gap:6px;height:150px;padding:8px 0 0;border-bottom:1px solid var(--vien)}
.bieu-do .cot{flex:1;min-width:8px;background:var(--nhan);border-radius:5px 5px 0 0;position:relative;min-height:3px}
.bieu-do .cot.thi{background:var(--vang)}
.bieu-do .cot span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--phu);font-variant-numeric:tabular-nums}
.chu-giai i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--nhan)}
.chu-giai i.thi{background:var(--vang)}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--vien)}
th{color:var(--phu);font-weight:600;font-size:.8rem}
.tem{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--nhan-nhat);color:var(--nhan-dam)}
.tem.thi{background:var(--vang-nen);color:var(--vang)}
.tem.sai{background:var(--sai-nen);color:var(--sai)}
.tem.dung{background:var(--dung-nen);color:var(--dung)}

.dong-cau{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--vien)}
.dong-cau:last-child{border-bottom:0}
.dong-cau .nd{flex:1;min-width:0}
.dong-cau .nd p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.xem-lai{border-left:4px solid var(--vien);padding-left:14px;margin:0 0 18px}
.xem-lai.dung{border-color:var(--dung)} .xem-lai.sai{border-color:var(--sai)} .xem-lai.bo{border-color:var(--vang)}
.thong-bao{border-radius:12px;padding:12px 14px;background:var(--nhan-nhat);color:var(--nhan-dam);margin:0 0 16px}
.thong-bao.canh-bao{background:var(--vang-nen);color:var(--vang)}
.trong{color:var(--phu);text-align:center;padding:28px 8px}

dialog{border:1px solid var(--vien);border-radius:16px;background:var(--the);color:var(--chu);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog .noi-dung{padding:20px;overflow:auto;max-height:calc(100vh - 32px)}
pre.mau{background:var(--nen);border:1px solid var(--vien);border-radius:10px;padding:12px;font:.8rem/1.5 ui-monospace,Consolas,monospace;overflow:auto;white-space:pre}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600;color:var(--nhan-dam)}
ul.loi{margin:6px 0 0;padding-left:20px;color:var(--sai);font-size:.85rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--chu);color:var(--nen);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100vw - 32px);text-align:center}
#toast.hien{opacity:1;transform:translateX(-50%)}
/* Công thức (KaTeX) và hình trong câu hỏi */
.toan.khoi{display:block;margin:.4em 0;overflow-x:auto;overflow-y:hidden}
.toan .katex{font-size:1.05em}
.hinh-cau{display:block;max-width:100%;max-height:320px;height:auto;margin:0 0 14px;border-radius:10px;border:1px solid var(--vien);background:#fff}
.hinh-nho{max-height:90px;margin:6px 0 0}
.hinh-giai{max-height:none;margin:10px 0 0}
.xem-hinh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.xem-hinh img{max-height:80px;max-width:160px;border-radius:8px;border:1px solid var(--vien);background:#fff}

/* Mục tiêu hằng ngày */
.muc-tieu__dong{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.muc-tieu__dong b{font-size:1.6rem;letter-spacing:-.02em;line-height:1.2}
.tuan{display:flex;gap:6px;margin-top:12px}
.tuan span{flex:1;text-align:center;font-size:.75rem;color:var(--phu)}
.tuan i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--vien)}
.tuan i.mot{border-color:var(--nhan)}
.tuan i.dat{background:var(--nhan);border-color:var(--nhan)}
.tuan .nay{font-weight:700;color:var(--nhan-dam)}
.bieu-do .cot.chua{opacity:.4}
.nhan-ngay{display:flex;gap:6px;color:var(--phu);font-size:.7rem;text-align:center;margin-top:4px}
.nhan-ngay span{flex:1;min-width:8px}
.hop-ct{font-variant-numeric:tabular-nums}
.chan-trang button{background:none;border:0;padding:0;color:var(--nhan-dam);text-decoration:underline;cursor:pointer;font-size:inherit}
.chan-trang .cach{margin:0 8px;color:var(--vien)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
'use strict';

/* ============================================================
   Tiện ích chung
   ============================================================ */
// Hai mục luyện thi tách riêng: mỗi mục có ngân hàng câu hỏi, lịch sử, thống kê và bài thi dở dang riêng.
const BO_DE = {
  clc: { tienTo: 'clc.', nhan: 'CLC', ten: 'Luyện Thi CLC', khauHieu: 'Luyện đề, thi thử và theo dõi tiến bộ mỗi ngày', tieuDe: 'Luyện thi vào lớp Chất Lượng Cao',
         moTa: 'Làm trắc nghiệm theo môn, thi thử có tính giờ và theo dõi tiến bộ qua từng lần làm bài.', soCau: 20, phut: 30,
         diemCau: 0, thang: 10 },   // diemCau 0 = chấm theo thang 10
  timo: { tienTo: 'timo.', nhan: 'TIMO', ten: 'Luyện Thi TIMO', khauHieu: 'Rèn tư duy toán, thi thử đủ 25 câu trong 120 phút', tieuDe: 'Luyện thi Toán TIMO',
          moTa: 'Rèn tư duy toán theo từng dạng: số học, hình học, tổ hợp & logic, quy luật. Đề thi thử tối đa 25 câu, mỗi câu 4 điểm (tối đa 100 điểm), làm trong 120 phút.',
          soCau: 25, toiDaCau: 25, phut: 120, diemCau: 4, thang: 100, monMacDinh: 'Toán' }
};
let boDe = 'clc';
try { if (localStorage.getItem('luyenthi.boDe') === 'timo') boDe = 'timo'; } catch (e) { /* dùng mặc định */ }
const tienTo = () => BO_DE[boDe].tienTo;
const KHOA = {                 // khóa lưu trữ theo mục đang chọn (mục CLC giữ nguyên khóa cũ nên không mất dữ liệu)
  get cauHoi() { return tienTo() + 'cauHoi.v1'; },     // câu hỏi người dùng nhập
  get lichSu() { return tienTo() + 'lichSu.v1'; },     // các lượt luyện tập / thi thử
  get thongKe() { return tienTo() + 'thongKe.v1'; },   // {idCau: {d, s, cuoi}}
  get cai() { return tienTo() + 'cai.v1'; },           // {anMau, mucTieu}
  get ngay() { return tienTo() + 'ngay.v1'; },         // {"YYYY-MM-DD": {c: số câu đã làm, d: số câu đúng, m: mục tiêu ngày đó}}
  get dangThi() { return tienTo() + 'dangThi.v1'; }    // bài thi đang làm dở
};
const CHU_CAI = 'ABCDE';

/* Kho lưu trữ: đọc/ghi đồng bộ như localStorage nhưng dữ liệu nằm trong bộ nhớ và được ghi bền vào IndexedDB, vì localStorage chỉ chứa
   khoảng 5 triệu ký tự — không đủ cho các bộ đề dạng ảnh. Dữ liệu cũ trong localStorage được chuyển sang IndexedDB ở lần mở đầu tiên.
   Không dùng được IndexedDB thì giữ cách cũ (localStorage). `khoSan` xong thì mới được đọc/ghi (xem lệnh khởi động ở cuối file). */
const KHO_KHOA = /^(clc|timo)\.|^luyenthi\.saoLuu$/;        // khoá của app (luyenthi.boDe vẫn ở localStorage vì đọc ngay lúc khởi động)
const lsDung = (() => { try { const k = '__clc'; localStorage.setItem(k, k); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
let idb = null;                // { bang: Map khoá→chuỗi, ghi, xoa } sau khi mở xong IndexedDB
let kho = {
  getItem: k => (idb ? (idb.bang.has(k) ? idb.bang.get(k) : null) : localStorage.getItem(k)),
  setItem(k, v) { v = String(v); if (idb) { idb.bang.set(k, v); idb.ghi(k, v); } else localStorage.setItem(k, v); },
  removeItem(k) { if (idb) { idb.bang.delete(k); idb.xoa(k); } else localStorage.removeItem(k); },
  key: i => (idb ? ([...idb.bang.keys()][i] ?? null) : localStorage.key(i)),
  get length() { return idb ? idb.bang.size : localStorage.length; }
};
const khoSan = (async () => {
  const hong = () => { if (!lsDung) kho = null; };
  if (typeof indexedDB === 'undefined') return hong();
  const chay = (db, kieu, f) => new Promise((ok, loi) => { const tx = db.transaction('kv', kieu); f(tx.objectStore('kv')); tx.oncomplete = ok; tx.onerror = tx.onabort = () => loi(tx.error); });
  try {
    const db = await new Promise((ok, loi) => { const rq = indexedDB.open('luyenthi', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onsuccess = () => ok(rq.result); rq.onerror = rq.onblocked = () => loi(rq.error); });
    const bang = new Map();
    await chay(db, 'readonly', st => { const rq = st.openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { bang.set(c.key, c.value); c.continue(); } }; });
    const cu = [];
    if (lsDung) for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (KHO_KHOA.test(k) && !bang.has(k)) cu.push(k); }
    if (cu.length) {                                       // chuyển dữ liệu cũ; chỉ xoá bản cũ sau khi IndexedDB đã ghi xong
      await chay(db, 'readwrite', st => cu.forEach(k => { const v = localStorage.getItem(k); bang.set(k, v); st.put(v, k); }));
      cu.forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } });
    }
    const loiGhi = () => thongBao('Không lưu được dữ liệu vào trình duyệt (bộ nhớ đầy hoặc bị chặn).');
    const ghiBen = f => { try { const tx = db.transaction('kv', 'readwrite'); f(tx.objectStore('kv')); tx.onabort = loiGhi; } catch (e) { loiGhi(); } };
    const kenh = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('luyenthi-kho') : null;     // nhiều tab cùng mở: giữ bản trong bộ nhớ khớp nhau
    if (kenh) kenh.onmessage = e => { const m = e.data; if (m && typeof m.k === 'string') { if (m.v == null) bang.delete(m.k); else bang.set(m.k, m.v); } };
    const bao = (k, v) => { try { kenh && kenh.postMessage({ k, v }); } catch (e) { /* bỏ qua */ } };
    idb = { bang, ghi: (k, v) => { ghiBen(st => st.put(v, k)); bao(k, v); }, xoa: k => { ghiBen(st => st.delete(k)); bao(k, null); } };
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* xin giữ dữ liệu lâu dài, không bắt buộc */ }
  } catch (e) { idb = null; hong(); }
})();
const boNho = {};
function doc(k, macDinh) {
  try { const v = kho ? kho.getItem(k) : boNho[k]; return v ? JSON.parse(v) : macDinh; }
  catch (e) { return macDinh; }
}
function ghi(k, v) {          // trả về false nếu trình duyệt không cho lưu (đầy bộ nhớ hoặc bị chặn)
  const s = JSON.stringify(v);
  try { if (kho) kho.setItem(k, s); else boNho[k] = s; return true; }
  catch (e) { boNho[k] = s; thongBao('Không lưu được dữ liệu vào trình duyệt (bộ nhớ đầy hoặc bị chặn).'); return false; }
}

// Tạo phần tử DOM; chuỗi con luôn là text nên dữ liệu nhập vào không thể chèn HTML.
function h(tag, thuocTinh, ...con) {
  const el = document.createElement(tag);
  if (thuocTinh) for (const [k, v] of Object.entries(thuocTinh)) {
    if (v == null || v === false || k === 'value') continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of con.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (thuocTinh && thuocTinh.value != null) el.value = thuocTinh.value;
  return el;
}

let toastId = null;
function thongBao(noiDung) {
  const el = document.getElementById('toast');
  el.textContent = noiDung; el.classList.add('hien');
  clearTimeout(toastId); toastId = setTimeout(() => el.classList.remove('hien'), 3600);
}

const boDau = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim().replace(/\s+/g, ' ');
const xao = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mmss = giay => { const m = Math.floor(giay / 60), s = giay % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); };
const soVN = n => Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 2 });
const ngayGio = iso => new Date(iso).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const taoId = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function taiXuong(ten, blob) {
  const a = h('a', { href: URL.createObjectURL(blob), download: ten });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const THU_VIEN = {
  xlsx: { url: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', bien: 'XLSX' },
  mammoth: { url: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js', bien: 'mammoth' },
  pdfjs: { url: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', bien: 'pdfjsLib',
           worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' },
  katex: { url: 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js', bien: 'katex',
           css: 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css' }
};
const dangTai = {};        // mỗi thư viện chỉ tải một lần dù được gọi nhiều lần cùng lúc
function taiThuVien(ten) {
  const t = THU_VIEN[ten];
  if (window[t.bien]) return Promise.resolve(window[t.bien]);
  return dangTai[ten] || (dangTai[ten] = new Promise((xong, loi) => {
    const s = document.createElement('script');
    s.src = t.url;
    s.onload = () => {
      if (t.worker) window[t.bien].GlobalWorkerOptions.workerSrc = t.worker;
      if (t.css) document.head.append(h('link', { rel: 'stylesheet', href: t.css }));
      xong(window[t.bien]);
    };
    s.onerror = () => { s.remove(); delete dangTai[ten]; loi(new Error('Không tải được thư viện (' + ten + '). Hãy kiểm tra kết nối mạng.')); };
    document.head.append(s);
  }));
}

/* ---------- Công thức toán (KaTeX) ----------
   Văn bản câu hỏi có thể chứa $x^2$, $$\frac{a}{b}$$, \(...\) hoặc \[...\]. vb() trả về text thường
   và các <span class="toan"> mang mã TeX trong thuộc tính; KaTeX chỉ được nạp (từ CDN) khi trang có công thức,
   và KaTeX tự dựng DOM nên không có chỗ nào dùng innerHTML. Chưa nạp được (offline) thì hiện nguyên mã gốc. */
const RE_TOAN = /\$\$([\s\S]+?)\$\$|\$(?![\s$])((?:[^$\n\\]|\\[\s\S])+?)\$(?!\d)|\\\(([\s\S]+?)\\\)|\\\[([\s\S]+?)\\\]/g;
function vb(s) {
  s = String(s ?? '');
  if (!/[$\\]/.test(s)) return s;
  const kq = []; let cuoi = 0, m;
  RE_TOAN.lastIndex = 0;
  while ((m = RE_TOAN.exec(s))) {
    const tex = m[1] ?? m[2] ?? m[3] ?? m[4];
    if (m[2] != null && /\s$/.test(tex)) continue;       // "$5 và $ 10": chữ chạy qua dấu $ không phải công thức
    if (m.index > cuoi) kq.push(s.slice(cuoi, m.index));
    const khoi = m[1] != null || m[4] != null;
    kq.push(h('span', { class: 'toan' + (khoi ? ' khoi' : ''), 'data-tex': tex.trim(), 'data-khoi': khoi ? '1' : null }, m[0]));
    cuoi = m.index + m[0].length;
  }
  if (!kq.length) return s;
  if (cuoi < s.length) kq.push(s.slice(cuoi));
  veToan();
  return kq;
}
let toanHen = 0;
function veToan() {
  clearTimeout(toanHen);
  toanHen = setTimeout(async () => {
    const ds = [...document.querySelectorAll('.toan:not([data-xong])')];
    if (!ds.length) return;
    let K; try { K = await taiThuVien('katex'); } catch (e) { return; }
    document.querySelectorAll('.toan:not([data-xong])').forEach(el => {
      try { K.render(el.dataset.tex, el, { displayMode: !!el.dataset.khoi, throwOnError: false }); el.dataset.xong = '1'; } catch (e) { /* để nguyên mã gốc */ }
    });
  }, 0);
}

/* ---------- Hình trong câu hỏi ----------
   q.hinh là data URL ảnh (đã nén khi thêm) hoặc đường dẫn http(s). Thuộc tính chỉ được đặt vào <img>,
   và chỉ nhận đúng các dạng này (không nhận SVG) nên dữ liệu nhập vào không thể chèn mã. */
const RE_HINH = /^(?:data:image\/(?:png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+|https?:\/\/[^\s"'<>]+)$/i;
const hinhHopLe = s => typeof s === 'string' && s.length < 1500000 && RE_HINH.test(s);
// Bài thi dở dang lưu cả danh sách câu vào localStorage nên không chép ảnh vào đó: tra lại theo id khi hiển thị
const hinhCua = q => q.hinh || cauNguoiDung().find(x => x.id === q.id)?.hinh;
// Bấm vào hình để xem cỡ gốc (hình lấy cả đề từ PDF có chữ nhỏ, trên điện thoại cần cuộn/phóng to)
function phongToHinh(src) {
  const hop = moHop(h('div', { class: 'hang giua', style: 'margin-bottom:10px' }, h('span', { class: 'meta', style: 'margin:0' }, 'Hình cỡ gốc (cuộn để xem hết)'),
    h('button', { class: 'btn vien nho', onclick: () => hop.close() }, 'Đóng')),
    h('div', { style: 'overflow:auto;max-height:calc(100vh - 120px);background:#fff;border-radius:10px' }, h('img', { src, alt: 'Hình cỡ gốc', style: 'display:block;max-width:none' })));
  hop.style.width = 'min(960px,calc(100vw - 24px))';
}
const hinhQ = (q, nho) => {
  const s = hinhCua(q);
  return hinhHopLe(s) ? h('img', { class: 'hinh-cau' + (nho ? ' hinh-nho' : ''), src: s, alt: 'Hình minh hoạ của câu hỏi (bấm để xem cỡ gốc)', title: 'Bấm để xem cỡ gốc',
    loading: 'lazy', referrerpolicy: 'no-referrer', style: 'cursor:zoom-in', onclick: () => phongToHinh(s) }) : null;
};
// Lời giải dạng ảnh (q.giaiHinh): dùng cho lời giải có công thức/hình mà chữ không thể hiện được; chỉ hiện sau khi trả lời
const giaiHinhCua = q => q.giaiHinh || cauNguoiDung().find(x => x.id === q.id)?.giaiHinh;
const giaiHinhQ = q => {
  const s = giaiHinhCua(q);
  return hinhHopLe(s) ? h('img', { class: 'hinh-cau hinh-giai', src: s, alt: 'Lời giải chi tiết (bấm để xem cỡ gốc)', title: 'Bấm để xem cỡ gốc',
    loading: 'lazy', referrerpolicy: 'no-referrer', style: 'cursor:zoom-in', onclick: () => phongToHinh(s) }) : null;
};
// Đọc ảnh từ file/clipboard, thu về tối đa 900 px mỗi cạnh để không làm đầy localStorage (khoảng 5 MB)
async function docAnh(file) {
  if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) throw new Error('Chỉ nhận ảnh PNG, JPG, GIF hoặc WebP.');
  if (file.size > 15e6) throw new Error('Ảnh quá lớn (tối đa 15 MB).');
  const bm = await createImageBitmap(file);
  const tl = Math.min(1, 900 / Math.max(bm.width, bm.height));
  const cv = h('canvas', { width: Math.max(1, Math.round(bm.width * tl)), height: Math.max(1, Math.round(bm.height * tl)) });
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(bm, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL('image/png');
  if (url.length > 250000) url = cv.toDataURL('image/jpeg', 0.85);      // hình vẽ đơn giản thì PNG nhỏ; ảnh chụp thì JPEG
  return url;
}

const cauMau = () => (boDe === 'timo' ? CAU_TIMO : CAU_MAU);

const caiDat = () => doc(KHOA.cai, {});
// Câu do người dùng nhập có thể kèm hình (data URL, vài trăm KB) nên chỉ phân tích JSON lại khi chuỗi lưu đổi
const nhoCau = { khoa: '', raw: null, val: [] };
function cauNguoiDung() {
  const khoa = KHOA.cauHoi;
  let raw = null;
  try { raw = kho ? kho.getItem(khoa) : (boNho[khoa] ?? null); } catch (e) { /* đọc lỗi thì coi như trống */ }
  if (nhoCau.khoa !== khoa || nhoCau.raw !== raw) { nhoCau.khoa = khoa; nhoCau.raw = raw; nhoCau.val = doc(khoa, []); }
  return nhoCau.val.slice();
}
const tatCaCau = () => (caiDat().anMau ? [] : cauMau()).concat(cauNguoiDung());
const dsMon = () => [...new Set(tatCaCau().map(q => q.mon))];
const dsChuDe = mon => [...new Set(tatCaCau().filter(q => !mon || q.mon === mon).map(q => q.chuDe))];

const KHONG_XAO = /(cả\s+[A-E]\b|tất cả|đáp án trên|all of the|none of the|both)/i;
const KHONG_XAO_NHAN = /\b[A-E]\s+(and|or|và|hoặc)\s+[A-E]\b/;     // lựa chọn nhắc tới chữ cái khác ("A and C are correct", "A và B đúng"): giữ nguyên thứ tự
// Câu điền đáp án (như phần "Điền đáp án" của TIMO): không có lựa chọn A–D, học sinh gõ kết quả.
// q.dien là danh sách các cách viết đáp án được chấp nhận; khi đó q.dapAn = [] và q.dung = -1.
const laDien = q => Array.isArray(q.dien) && q.dien.length > 0;
function giaTri(s) {          // "1,5" = "1.5" = "3/2"; đơn vị đi kèm ("12 cm") chỉ cần khớp khi cả hai bên đều ghi đơn vị
  const t = String(s ?? '').toLowerCase().replace(/\s+/g, '').replace(/,/g, '.');
  const m = /^(-?\d+(?:\.\d+)?)(?:\/(\d+))?(.*)$/.exec(t);
  if (!m || (m[2] && !Number(m[2]))) return { n: null, t, dv: '' };
  return { n: m[2] ? Number(m[1]) / Number(m[2]) : Number(m[1]), t, dv: m[3] };
}
const chuThuan = t => t.replace(/[^\p{L}\p{N}]/gu, '');    // đáp án chữ (viết lại câu, sắp xếp từ): bỏ qua dấu câu và khoảng trắng (đã không phân biệt hoa thường)
// Phần sau số có chứa thêm số ("giờ45phút", ":45") là đáp án ghép (8 giờ 45 phút), không phải đơn vị ("cm2", "km/h"): không được bỏ qua khi người dùng chỉ gõ số đầu
const gopSo = dv => /\d/.test(dv) && !/^[\p{L}\/²³.]+\d{0,2}$/u.test(dv);
function khopDien(q, s) {
  const a = giaTri(s); if (!a.t) return false;
  return q.dien.some(d => {
    const b = giaTri(d);
    return a.n != null && b.n != null ? Math.abs(a.n - b.n) < 1e-9 && (a.dv === b.dv || (!a.dv && !gopSo(b.dv)) || (!b.dv && !gopSo(a.dv))) : a.n == null && b.n == null ? chuThuan(a.t) === chuThuan(b.t) : a.t === b.t;
  });
}
const dungCau = (q, chon) => chon != null && (laDien(q) ? khopDien(q, chon) : chon === q.dung);
const chonText = (q, chon) => (laDien(q) ? String(chon) : q.dapAn[chon] === CHU_CAI[chon] ? CHU_CAI[chon] : CHU_CAI[chon] + '. ' + q.dapAn[chon]);
const dungText = q => (laDien(q) ? q.dien.join('  hoặc  ') : q.dapAn[q.dung] === CHU_CAI[q.dung] ? CHU_CAI[q.dung] : CHU_CAI[q.dung] + '. ' + q.dapAn[q.dung]);
// Nội dung một nút lựa chọn: nếu lựa chọn chỉ là nhãn (đáp án nằm trong hình) thì ghi "Phương án X" thay vì lặp lại chữ cái
const noiDungLc = (t, k) => (t === CHU_CAI[k] ? 'Phương án ' + t : vb(t));

function xaoDapAn(q) {
  if (laDien(q)) return { id: q.id, mon: q.mon, chuDe: q.chuDe, nd: q.nd, giaiThich: q.giaiThich || '', dapAn: [], dung: -1, dien: q.dien };
  const idx = q.dapAn.map((_, i) => i);
  // Lựa chọn chỉ là nhãn "A, B, C, D" (đáp án nằm trong hình) thì phải giữ nguyên thứ tự để khớp với hình
  const laNhan = q.dapAn.every((t, i) => t === CHU_CAI[i]);
  const thuTu = laNhan || KHONG_XAO.test(q.dapAn.join(' | ')) || KHONG_XAO_NHAN.test(q.dapAn.join(' | ')) ? idx : xao(idx);
  return { id: q.id, mon: q.mon, chuDe: q.chuDe, nd: q.nd, giaiThich: q.giaiThich || '',
           dapAn: thuTu.map(i => q.dapAn[i]), dung: thuTu.indexOf(q.dung) };
}

// Danh sách đáp án điền: mảng hoặc chuỗi "72 | 72 cm" (ngăn cách bằng | hoặc ;)
const tachDien = v => (Array.isArray(v) ? v : String(v ?? '').split(/\s*[|;]\s*/)).map(x => String(x ?? '').trim()).filter(Boolean);
function chuanHoaCau(c) {
  const dapAn = (c.dapAn || []).map(x => String(x ?? '').trim()).filter(Boolean);
  const dien = dapAn.length < 2 ? tachDien(c.dien) : [];
  return {
    id: taoId(),

    nd: String(c.nd || '').trim(),

    giaiThich: String(c.giaiThich || '').trim(),
    nguon: String(c.nguon || '').trim(),
    ...(hinhHopLe(String(c.hinh || '').trim()) ? { hinh: String(c.hinh).trim() } : {}),
    ...(hinhHopLe(String(c.giaiHinh || '').trim()) ? { giaiHinh: String(c.giaiHinh).trim() } : {})
  };
}
// Kiểm tra một câu đọc từ file sao lưu (không tin dữ liệu): trả về câu đã chuẩn hóa, giữ nguyên id, hoặc null nếu hỏng
function hopLeCau(c) {
  if (!c || typeof c !== 'object' || typeof c.nd !== 'string' || !c.nd.trim()) return null;
  const s = (v, max) => String(v ?? '').trim().slice(0, max);
  const goc = { id: typeof c.id === 'string' && /^u[0-9a-z]{3,40}$/.test(c.id) ? c.id : taoId(),
                mon: s(c.mon, 60) || 'Khác', chuDe: s(c.chuDe, 80) || 'Chung', nd: s(c.nd, 5000),
                giaiThich: s(c.giaiThich, 5000), nguon: s(c.nguon, 120), ...(hinhHopLe(c.hinh) ? { hinh: c.hinh } : {}), ...(hinhHopLe(c.giaiHinh) ? { giaiHinh: c.giaiHinh } : {}) };
  const dapAn = Array.isArray(c.dapAn) ? c.dapAn.map(x => s(x, 1000)).filter(Boolean).slice(0, CHU_CAI.length) : [];
  if (dapAn.length >= 2) return Number.isInteger(c.dung) && c.dung >= 0 && c.dung < dapAn.length ? { ...goc, dapAn, dung: c.dung } : null;
  const dien = tachDien(c.dien).map(x => x.slice(0, 200)).slice(0, 20);
  return dien.length ? { ...goc, dapAn: [], dung: -1, dien } : null;
}
// Hai câu là một khi cùng môn, cùng nội dung và cùng các lựa chọn/đáp án (nhiều đề có câu cùng chữ như "Có bao nhiêu hình chữ nhật trong hình?" nhưng khác hình và đáp án).
// Câu thuộc đề của trường thì chủ đề (tên trường + đề) cũng là một phần của khóa: các đề luyện lặp lại câu của nhau nên mỗi đề phải giữ đủ câu.
const khoaTrung = q => boDau(q.mon) + '|' + (truongDeCua(q) ? boDau(chuDeChuan(q)) : '') + '|' + boDau(q.nd) + '|' + (laDien(q) ? 'd:' + q.dien.map(boDau).join(';') : (q.dapAn || []).map(boDau).join(';'));

/* ============================================================
   Thống kê & lịch sử
   ============================================================ */
const khoaNgay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const homNay = () => khoaNgay(new Date());
const congNgay = n => { const d = new Date(); d.setDate(d.getDate() + n); return khoaNgay(d); };

// Lặp lại ngắt quãng (kiểu hộp Leitner) cho "sổ câu sai": mỗi câu có hộp h = 0..5 và ngày ôn kế tiếp den.
// Làm sai → về hộp 0, ôn lại ngay; làm đúng lúc đã đến hạn → lên một hộp, chờ KHOANG[hộp mới] ngày.
// Lên tới hộp cuối (cách 30 ngày) thì coi là đã thuộc và rời sổ. Làm đúng khi chưa đến hạn thì giữ nguyên hộp,
// nếu không luyện đi luyện lại trong cùng một ngày sẽ "leo hộp" mà không thật sự nhớ lâu.
const KHOANG = [0, 1, 3, 7, 14, 30];
const HOP_CUOI = KHOANG.length - 1;
const layHop = o => (Number.isInteger(o.h) ? o.h : o.d + o.s === 0 || o.cuoi === 's' ? 0 : 1);     // dữ liệu cũ chưa có hộp
const denHan = o => !o.den || o.den <= homNay();
const trongSo = o => !!o && o.s > 0 && layHop(o) < HOP_CUOI;                   // câu từng sai và chưa thuộc
const canOnLai = o => trongSo(o) && denHan(o);

function ghiNhanCau(q, dung) {
  const tk = doc(KHOA.thongKe, {});
  const o = tk[q.id] || { d: 0, s: 0, cuoi: '' };
  const hop = layHop(o);
  if (dung) o.d++; else o.s++;
  o.cuoi = dung ? 'd' : 's';
  o.h = dung ? (denHan(o) ? Math.min(HOP_CUOI, hop + 1) : hop) : 0;
  if (!dung || o.h !== hop || !o.den) o.den = congNgay(KHOANG[o.h]);
  tk[q.id] = o;
  ghi(KHOA.thongKe, tk);
  ghiNgay(dung);
}

// Số câu đã làm mỗi ngày (giữ 400 ngày gần nhất) để tính mục tiêu hằng ngày và chuỗi ngày
const mucTieu = () => Math.min(500, Math.max(1, parseInt(caiDat().mucTieu) || 10));
function ghiNgay(dung) {
  const nk = doc(KHOA.ngay, {}), k = homNay();
  const o = nk[k] || { c: 0, d: 0 };
  o.c++; if (dung) o.d++; o.m = mucTieu();
  nk[k] = o;
  const khoa = Object.keys(nk).sort();
  khoa.slice(0, Math.max(0, khoa.length - 400)).forEach(x => delete nk[x]);
  ghi(KHOA.ngay, nk);
}
const datMucTieu = (nk, k) => { const o = nk[k]; return !!o && o.c >= (k === homNay() ? mucTieu() : o.m || 10); };
function chuoiNgay() {        // số ngày liên tiếp đạt mục tiêu; hôm nay chưa đạt thì chuỗi vẫn được giữ tới hôm qua
  const nk = doc(KHOA.ngay, {}), d = new Date();
  if (!datMucTieu(nk, khoaNgay(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (datMucTieu(nk, khoaNgay(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// Điểm: mục CLC chấm thang 10; mục TIMO mỗi câu đúng được diemCau điểm (30 câu × 4 = 120 điểm).
const thangDiem = () => BO_DE[boDe].thang;
const diemQuyDoi = e => e.diem / (e.toiDa || 10) * thangDiem();     // đưa về thang chuẩn của mục để so sánh các lượt
// Ngân hàng chỉ có một môn (như TIMO: chỉ có Toán) thì thống kê/chia đề theo chủ đề thay vì theo môn
const motMon = () => dsMon().length === 1;
const nhomCua = (q, mot) => (mot ? q.chuDe : q.mon);
function luuLuot(loai, kq, giay, ten) {
  const dung = kq.filter(x => dungCau(x.q, x.chon)).length;
  const theoMon = {}, mot = motMon();
  kq.forEach(x => {
    const k = nhomCua(x.q, mot);
    const m = theoMon[k] || (theoMon[k] = { dung: 0, tong: 0 });
    m.tong++; if (dungCau(x.q, x.chon)) m.dung++;
  });
  const diemCau = BO_DE[boDe].diemCau;
  const e = { id: taoId(), loai, ten, ngay: new Date().toISOString(), dung, tong: kq.length,
              diem: diemCau ? dung * diemCau : (kq.length ? Math.round(dung / kq.length * 1000) / 100 : 0),
              toiDa: diemCau ? kq.length * diemCau : 10, giay, theoMon };
  const ls = doc(KHOA.lichSu, []); ls.push(e);
  ghi(KHOA.lichSu, ls.slice(-500));
  return e;
}

const TEN_THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

function locCau({ mon, chuDe, nguon }) {
  const tk = doc(KHOA.thongKe, {});
  return tatCaCau().filter(q => (!mon || q.mon === mon) && (!chuDe || q.chuDe === chuDe) &&
    (nguon === 'tatca' || (nguon === 'sai' && tk[q.id]?.cuoi === 's') || (nguon === 'chua' && !tk[q.id])));
}

function phienLuyen(ds, ten) {
  dungDongHo(); hienNav('luyen');
  const kq = [], bat = Date.now();
  let i = 0;
  const lam = new Set();       // chỉ số các câu đã trả lời; câu bỏ qua không nằm trong đây nên có thể quay lại làm
  const keTiep = () => { let j = i + 1; while (j < ds.length && lam.has(j)) j++; return j; }       // câu chưa làm kế tiếp (= ds.length nếu hết)
  const keTruoc = () => { let j = i - 1; while (j >= 0 && lam.has(j)) j--; return j; }              // câu chưa làm gần nhất phía trước (-1 nếu không có)
  const ve = () => {
    if (i >= ds.length) {      // đi hết lượt mà còn câu bỏ qua → hỏi có muốn làm lại không
      const chua = ds.map((_, k) => k).filter(k => !lam.has(k));
      if (chua.length && confirm(`Còn ${chua.length} câu bạn đã bỏ qua. Bấm OK để làm lại các câu đó, Hủy để xem kết quả.`)) { i = chua[0]; return ve(); }
      return ketThuc();
    }
    const q = ds[i]; let daChon = null;
    // Nút sang câu sau luôn hiện: chưa trả lời thì là "Bỏ qua" (câu bỏ qua không tính điểm), trả lời rồi thì thành nút chính
    const cuoi = keTiep() >= ds.length;
    const nutTiep = h('button', { class: 'btn vien', onclick: () => { i = keTiep(); ve(); } }, cuoi ? 'Bỏ qua và xem kết quả' : 'Bỏ qua, sang câu tiếp →');
    const nutLui = keTruoc() >= 0 ? h('button', { class: 'btn vien', onclick: () => { i = keTruoc(); ve(); } }, '← Quay lại câu chưa làm') : null;
    const daLam = () => { nutTiep.className = 'btn'; nutTiep.textContent = cuoi ? 'Xem kết quả' : 'Câu tiếp theo →'; nutTiep.focus(); };
    const vung = h('div');
    let nut = [], oDien = null;
    if (laDien(q)) {            // câu điền đáp án: gõ kết quả rồi bấm Kiểm tra (hoặc Enter)
      oDien = h('input', { type: 'text', class: 'o-dien', placeholder: 'Nhập đáp án của bạn', autocomplete: 'off', inputmode: 'text' });
      const kiemTra = () => {
        if (daChon != null || !oDien.value.trim()) return;
        const v = oDien.value.trim(), dung = khopDien(q, v);
        daChon = v; lam.add(i); kq.push({ q, chon: v });
        ghiNhanCau(q, dung);
        oDien.disabled = true; btnKt.disabled = true; oDien.classList.add(dung ? 'dung' : 'sai');
        thay(vung,
          h('p', { class: 'phan-hoi ' + (dung ? 'dung' : 'sai') }, dung ? 'Chính xác!' : ['Chưa đúng. Đáp án đúng là ', vb(dungText(q)), '.']),
          q.giaiThich ? h('div', { class: 'giai-thich' }, h('b', null, 'Giải thích: '), vb(q.giaiThich)) : null, giaiHinhQ(q));
        daLam();
      };
      const btnKt = h('button', { class: 'btn', onclick: kiemTra }, 'Kiểm tra');
      oDien.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); kiemTra(); } });
      nut = [h('div', { class: 'hang dien-hang' }, oDien, btnKt)];
    } else nut = q.dapAn.map((t, k) => h('button', { class: 'dap-an', onclick: () => {
      if (daChon != null) return;
      daChon = k; lam.add(i); kq.push({ q, chon: k });
      ghiNhanCau(q, k === q.dung);
      nut.forEach((b, j) => { b.disabled = true; if (j === q.dung) b.classList.add('dung'); else if (j === k) b.classList.add('sai'); });
      thay(vung,
        h('p', { class: 'phan-hoi ' + (k === q.dung ? 'dung' : 'sai') }, k === q.dung ? 'Chính xác!' : `Chưa đúng. Đáp án đúng là ${CHU_CAI[q.dung]}.`),
        q.giaiThich ? h('div', { class: 'giai-thich' }, h('b', null, 'Giải thích: '), vb(q.giaiThich)) : null, giaiHinhQ(q));
      daLam();
    } }, h('span', { class: 'chu-cai' }, CHU_CAI[k]), h('span', { class: 'nd' }, noiDungLc(t, k))));
    dat(
      tieuDe('Luyện tập: ' + ten),
      h('div', { class: 'tien-do' }, h('i', { style: `width:${i / ds.length * 100}%` })),
      h('div', { class: 'the' },
        h('div', { class: 'meta' }, `Câu ${i + 1}/${ds.length} · ${q.mon} · ${q.chuDe}`),
        h('div', { class: 'cau-nd' }, vb(q.nd)), hinhQ(q), nut, vung, h('div', { class: 'hang' }, nutLui, nutTiep)),
      h('button', { class: 'btn vien nho', onclick: () => { if (!kq.length || confirm('Dừng luyện tập? Kết quả các câu đã làm vẫn được ghi nhận vào thống kê câu hỏi.')) di('luyen'); } }, 'Dừng'));
  };
  const ketThuc = () => {
    if (!kq.length) { di('luyen'); return thongBao('Bạn đã bỏ qua tất cả các câu nên chưa có kết quả để lưu.'); }
    const e = luuLuot('luyen', kq, Math.round((Date.now() - bat) / 1000), ten);
    hienKetQua(e, kq, { lamLai: () => di('luyen') });
  };
  ve();
}

   Thi thử
   ============================================================ */
function chonCanBang(mons, tong) {
  const tat = tatCaCau();
  // Chỉ một môn (ví dụ TIMO chỉ có Toán) thì chia đều theo chủ đề để đề bao quát các dạng bài
  const nhom = mons.length === 1
    ? [...new Set(tat.filter(q => q.mon === mons[0]).map(q => q.chuDe))].map(c => xao(tat.filter(q => q.mon === mons[0] && q.chuDe === c)))
    : mons.map(m => xao(tat.filter(q => q.mon === m)));
  const chon = nhom.map(() => []);
  let con = tong, vong = true;
  while (con > 0 && vong) {            // chia đều từng lượt, môn nào hết câu thì bỏ qua
    vong = false;
    for (let k = 0; k < nhom.length && con > 0; k++) {
      if (nhom[k].length) { chon[k].push(nhom[k].pop()); con--; vong = true; }
    }
  }
  return chon.flat();
}

/* Đề của các trường (chỉ mục CLC): câu có chủ đề dạng "Thanh Xuân 2019–2020" (tên trường + năm học) được gom thành
   từng đề; làm nguyên đề theo thứ tự câu trong đề, có tính giờ. Không cần thêm trường dữ liệu riêng cho câu hỏi.
   Tên đề là năm học ("2023–2024") hoặc đề đánh số ("Đề luyện 01", "Đề số 2", "Test 3"). */
const RE_DE_TRUONG = /^(.+?)\s+((?:19|20)\d\d(?:\s*[–—-]\s*(?:19|20)\d\d)?(?:\s*\([^)]*\))?|(?:Đề|Test)(?:\s+[^\d\s]+)?\s+\d{1,3})$/i;     // năm học có thể kèm ghi chú trong ngoặc: "2020–2021 (nâng cao)"
const TEN_TRUONG_KHAC = { 'nang khieu': 'Năng Khiếu Sư Phạm' };      // cách gọi khác của cùng một trường (khóa: tên bỏ dấu, chữ thường) → tên chuẩn
const truongDeCua = q => {
  const m = RE_DE_TRUONG.exec(String(q.chuDe || '').trim());
  if (!m) return null;
  const ten = m[1].trim();
  return { tenTruong: TEN_TRUONG_KHAC[boDau(ten)] || ten, de: m[2].replace(/\s*[–—-]\s*/, '–') };
};
const chuDeChuan = q => { const t = truongDeCua(q); return t ? t.tenTruong + ' ' + t.de : String(q.chuDe || ''); };
const laDeNam = de => /^(19|20)\d\d/.test(de);                    // đề theo năm học (mới nhất lên trước) hay đề đánh số (theo thứ tự tăng dần)
const tenBaiThi = (tenTruong, de, mon) => (laDeNam(de) ? `Đề ${tenTruong} ${de}` : `${tenTruong} · ${de}`) + ` · ${mon}`;
const MON_TRUONG = ['Toán', 'Tiếng Việt', 'Tiếng Anh'];        // ba môn thi vào lớp 6 chuyên/chất lượng cao; luôn hiện đủ ba mục
const monDeCua = q => {          // gom các cách ghi môn ("Tieng Anh", "English", "Văn"...) về ba môn chuẩn; môn lạ giữ nguyên
  const m = String(q.mon || '').trim(), t = m.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase();
  return /^toan(\s|$)/.test(t) ? 'Toán' : /^(tieng\s*)?viet(\s|$)|^van(\s|$)/.test(t) ? 'Tiếng Việt' : /^(tieng\s*)?anh(\s|$)|^english(\s|$)/.test(t) ? 'Tiếng Anh' : m;
};
function dsDeTruong(mon) {       // [{tenTruong, des: [{de, cau: [q]}]}] của một môn (bỏ trống = mọi môn): trường theo A–Z, đề mới nhất lên trước
  const mapT = new Map();
  tatCaCau().forEach(q => {
    const t = truongDeCua(q); if (!t || (mon && monDeCua(q) !== mon)) return;
    const mapD = mapT.get(t.tenTruong) || mapT.set(t.tenTruong, new Map()).get(t.tenTruong);
    (mapD.get(t.de) || mapD.set(t.de, []).get(t.de)).push(q);
  });
  return [...mapT].sort((a, b) => a[0].localeCompare(b[0], 'vi'))
    .map(([tenTruong, mapD]) => ({ tenTruong, des: [...mapD].sort((a, b) => (laDeNam(a[0]) ? -1 : 1) * a[0].localeCompare(b[0], 'vi', { numeric: true })).map(([de, cau]) => ({ de, cau })) }));
}
let thiTab = 'tong';             // 'tong' (đề tổng hợp) | 'truong' (đề của các trường)
let thiMonTruong = 'Toán';       // môn đang xem trong tab đề của các trường
let thiTruongChon = '';          // trường đang xem ('' = tất cả các trường)
const PHUT_DE_TRUONG = 40;

  if (!cacMon.includes(thiMonTruong)) thiMonTruong = cacMon[0];
  const cacTruong = dsDeTruong();                                  // mọi môn: dùng cho hàng nút chọn trường
  if (thiTruongChon && !cacTruong.some(t => t.tenTruong === thiTruongChon)) thiTruongChon = '';
  const demDe = (m, truong) => dsDeTruong(m).filter(t => !truong || t.tenTruong === truong).reduce((n, t) => n + t.des.length, 0);

      h('button', { class: 'btn nho' + (t.tenTruong === thiTruongChon ? '' : ' vien'), 'aria-pressed': String(t.tenTruong === thiTruongChon), onclick: () => chonTruong(t.tenTruong) },
        t.ten, ' ', h('span', { class: 'tem', style: 'margin-left:4px' }, cacMon.reduce((n, m) => n + demDe(m, t.tenTruong), 0) + ' đề')))),
    h('div', { class: 'nhan', style: 'margin:0 0 6px' }, 'Môn'),
    h('div', { class: 'hang', style: 'margin:0 0 14px' }, cacMon.map(m =>
      h('button', { class: 'btn' + (m === mon ? '' : ' vien'), onclick: () => { thiMonTruong = m; thiCauHinh(); } }, m, ' ', h('span', { class: 'tem', style: 'margin-left:4px' }, demDe(m, thiTruongChon) + ' đề')))),
    h('div', { class: 'the' }, h('div', { class: 'hai-cot' }, truong('Thời gian làm bài (phút)', phut, 'Đề của trường thường 40–45 phút; đổi tùy ý trước khi bắt đầu.')),
      h('p', { class: 'meta', style: 'margin:0' }, 'Chọn một đề của trường để làm nguyên đề theo thứ tự câu như đề thật. Câu hỏi thuộc đề của trường khi có "Môn" (Toán, Tiếng Việt, Tiếng Anh) và "Chủ đề" dạng "Cầu Giấy 2023–2024" (tên trường + năm học).')),
    ...(truongs.length ? truongs.map(t => h('div', { class: 'the' },
      h('h3', { style: 'margin:0 0 4px' }, t.tenTruong), h('p', { class: 'meta', style: 'margin-top:0' }, `${t.des.length} đề môn ${mon}`),
      t.des.map(d => {
        const lan = ls.filter(x => x.ten === tenBaiThi(t.tenTruong, d.de, mon));
        const tot = lan.reduce((m, x) => Math.max(m, x.diem / (x.toiDa || 10) * 10), 0);

/* ---------- Đọc file đề ---------- */
const TEN_COT = {
  mon: ['mon', 'mon hoc'],
  chuDe: ['chu de', 'chuyen de', 'dang'],
  nd: ['cau hoi', 'noi dung', 'de bai', 'cau'],
  dung: ['dap an', 'dap an dung', 'dung', 'key'],
  giaiThich: ['giai thich', 'loi giai', 'huong dan', 'huong dan giai'],
  hinh: ['hinh', 'hinh anh', 'anh', 'image', 'link hinh']      // địa chỉ ảnh http(s); không dán được ảnh vào ô Excel
};
function anhXaCot(hang) {
  const cot = { opts: {} };
  hang.forEach((t, c) => {
    const k = boDau(t); if (!k) return;
    const m = /^(?:dap an |phuong an |lua chon )?([a-e])$/.exec(k);
    if (m) { cot.opts[m[1].toUpperCase()] = c; return; }
    for (const [ten, ds] of Object.entries(TEN_COT)) if (ds.includes(k) && cot[ten] == null) cot[ten] = c;
  });
  return cot;
}
function phanTichBang(hang, tenBang) {
  const ds = [], loi = [];
  let tieuDeIdx = hang.findIndex(r => anhXaCot(r).nd != null);
  if (tieuDeIdx < 0) return { ds, loi: [`Sheet "${tenBang}": không tìm thấy dòng tiêu đề có cột "Câu hỏi".`] };
  const cot = anhXaCot(hang[tieuDeIdx]);
  if (cot.dung == null) return { ds, loi: [`Sheet "${tenBang}": cần có cột "Đáp án" (và các cột A, B, C, D nếu là câu trắc nghiệm).`] };
  for (let r = tieuDeIdx + 1; r < hang.length; r++) {
    const row = hang[r], o = c => (c == null ? '' : String(row[c] ?? '').trim());
    const nd = o(cot.nd); if (!nd) continue;
    const nhan = `Sheet "${tenBang}" dòng ${r + 1}`;
    const luaChon = Object.entries(cot.opts).sort().map(([k, c]) => ({ k, t: o(c) })).filter(x => x.t);
    const da = o(cot.dung); let dung = -1;
    if (!luaChon.length) {       // không có lựa chọn nào → câu điền đáp án, cột "Đáp án" là kết quả (nhiều cách viết cách nhau bằng |)
      if (!da) loi.push(`${nhan}: thiếu đáp án.`);
      else ds.push({ mon: o(cot.mon), chuDe: o(cot.chuDe), nd, dapAn: [], dien: tachDien(da), giaiThich: o(cot.giaiThich), hinh: o(cot.hinh) });
      continue;
    }
    if (luaChon.length < 2) { loi.push(`${nhan}: cần ít nhất 2 lựa chọn.`); continue; }
    const mc = /^([A-E])(?:\s*[\.\)\-:]|$)/i.exec(da);
    if (mc) dung = luaChon.findIndex(x => x.k === mc[1].toUpperCase());
    else {                       // khớp nội dung trước (đáp án "4" có thể chính là chữ "4"), rồi mới tính là số thứ tự
      dung = luaChon.findIndex(x => boDau(x.t) === boDau(da));
      if (dung < 0 && /^[1-5]$/.test(da)) dung = Number(da) - 1;
    }
    if (dung < 0 || dung >= luaChon.length) { loi.push(`${nhan}: đáp án "${da}" không khớp lựa chọn nào.`); continue; }
    ds.push({ mon: o(cot.mon), chuDe: o(cot.chuDe), nd, dapAn: luaChon.map(x => x.t), dung, giaiThich: o(cot.giaiThich), hinh: o(cot.hinh) });
  }
  return { ds, loi };
}

// Các từ khóa chấp nhận cả dạng không dấu (PDF/văn bản xuất từ phần mềm cũ hay mất dấu tiếng Việt)
const RE_MON = /^\s*(?:môn|mon)(?:\s*học|\s*hoc)?\s*[:：]\s*(.+?)\s*$/i;
const RE_CHUDE = /^\s*(?:chủ\s*đề|chu\s*de|chuyên\s*đề|chuyen\s*de)\s*[:：]\s*(.+?)\s*$/i;
const RE_CAU = /^\s*(?:(?:câu|cau|bài|bai)\s*(\d{1,3})\s*[\.\):\-]?\s*|(\d{1,3})[\.\)]\s+)(.*)$/i;
const RE_DAPAN = /^\s*(?:(?:đáp|dap)\s*(?:án|an)(?:\s*đúng|\s*dung)?\s*[:：\.\-]?|(?:đ\/a|d\/a|đa|answer|key)\s*[:：])\s*([A-Ea-e])(?![A-Za-zÀ-ỹ])/i;
const RE_DAPAN_DIEN = /^\s*(?:(?:đáp|dap)\s*(?:án|an)(?:\s*đúng|\s*dung)?|đ\/a|d\/a|answer)\s*[:：]\s*(\S.*)$/i;
const RE_GIAITHICH =/^\s*(?:giải\s*thích|giai\s*thich|hướng\s*dẫn\s*giải|huong\s*dan\s*giai|hướng\s*dẫn|huong\s*dan|lời\s*giải|loi\s*giai)\s*[:：]\s*(.*)$/i;

function tachLuaChon(dong) {
  const dau = /^\s*(\*?)\s*([A-E])\s*[\.\):]\s*/.exec(dong);
  if (!dau) return null;
  const kq = []; let k = dau[2], sao = !!dau[1], rest = dong.slice(dau[0].length);
  for (;;) {                    // cho phép nhiều lựa chọn trên cùng một dòng: "A. 3  B. 4  C. 5"
    const tiep = String.fromCharCode(k.charCodeAt(0) + 1);
    const m = tiep <= 'E' ? new RegExp('\\s(\\*?)\\s*' + tiep + '\\s*[\\.\\):]\\s+').exec(rest) : null;
    if (!m) { kq.push({ k, sao, t: rest.trim() }); break; }
    kq.push({ k, sao, t: rest.slice(0, m.index).trim() });
    sao = !!m[1]; k = tiep; rest = rest.slice(m.index + m[0].length);
  }
  return kq;
}

// Nhiều đề (nhất là PDF) có "BẢNG ĐÁP ÁN" gom ở cuối: "1.A 2.B 3.C ..." hoặc mỗi dòng "Câu 1: A".
// Tìm khối đó từ cuối tài liệu: phải có ít nhất 3 cặp số–chữ và số dòng không nhiều hơn số cặp
// (để dòng "Đáp án: B" nằm giữa các câu không bị nhầm thành bảng).
const RE_DAU_BANG = /^\s*(?:(?:bảng|bang)\s*)?(?:(?:đáp|dap)\s*(?:án|an)|đ\/a|d\/a)(?:\s*đúng|\s*dung)?\s*[:：]?\s*(.*)$/i;
const RE_CAP_DAPAN = /(\d{1,3})\s*[\.\):\-–]?\s*([A-Ea-e])(?![A-Za-zÀ-ỹ0-9])/g;
function tachBangDapAn(dong) {
  for (let i = dong.length - 1; i >= 0; i--) {
    const m = RE_DAU_BANG.exec(dong[i]);
    if (!m) continue;
    const khoi = [m[1], ...dong.slice(i + 1)].filter(l => l.trim());
    const cap = khoi.flatMap(l => [...l.matchAll(RE_CAP_DAPAN)]);
    if (cap.length >= 3 && khoi.length <= cap.length) {
      const bang = {};
      cap.forEach(c => { if (!(Number(c[1]) in bang)) bang[Number(c[1])] = c[2].toUpperCase(); });
      return { dong: dong.slice(0, i), bang };
    }
  }
  return { dong, bang: {} };
}

function phanTichVanBan(van) {
  const { dong, bang } = tachBangDapAn(van.normalize('NFC').replace(/\r/g, '').split('\n'));
  const ds = [], loi = [];
  let mon = '', chuDe = '', cur = null, trangThai = '', soCuoi = 0;
  const dong_cau = () => {
    if (!cur) return;
    const nd = cur.nd.trim(), nhan = `Câu ${cur.so}${nd ? ' ("' + nd.slice(0, 40) + (nd.length > 40 ? '…' : '') + '")' : ''}`;
    if (!nd) loi.push(`Câu ${cur.so}: không có nội dung câu hỏi.`);
    else if (!cur.opts.length && cur.dien) ds.push({ mon: cur.mon, chuDe: cur.chuDe, nd, dapAn: [], dien: tachDien(cur.dien), giaiThich: cur.gt.trim() });
    else if (cur.opts.length < 2) loi.push(`${nhan}: cần ít nhất 2 lựa chọn (A., B., …).`);
    else {
      let dung = cur.dung;
      if (dung == null) {
        dung = cur.opts.findIndex(o => o.sao);
        if (dung < 0 && bang[cur.so]) dung = cur.opts.findIndex(o => o.k === bang[cur.so]);
      } else dung = cur.opts.findIndex(o => o.k === dung);
      if (dung < 0) loi.push(`${nhan}: thiếu dòng "Đáp án: …" (hoặc bảng đáp án ở cuối tài liệu) hoặc đáp án không khớp.`);
      else ds.push({ mon: cur.mon, chuDe: cur.chuDe, nd, dapAn: cur.opts.map(o => o.t), dung, giaiThich: cur.gt.trim() });
    }
    cur = null;
  };
  for (const raw of dong) {
    const d = raw.trim(); if (!d) continue;
    let m;
    if ((m = RE_MON.exec(d))) { dong_cau(); mon = m[1]; continue; }
    if ((m = RE_CHUDE.exec(d))) { dong_cau(); chuDe = m[1]; continue; }
    const mq = RE_CAU.exec(d);
    if (mq && (mq[1] != null || !cur || Number(mq[2]) === soCuoi + 1) && !(cur && trangThai === 'gt' && mq[1] == null && Number(mq[2]) !== soCuoi + 1)) {
      dong_cau();
      soCuoi = Number(mq[1] ?? mq[2]);
      cur = { so: soCuoi, nd: mq[3], opts: [], dung: null, gt: '', mon, chuDe };
      trangThai = 'nd';
      continue;
    }
    if (!cur) continue;
    // Câu chưa có lựa chọn nào mà có "Đáp án: 72" → câu điền đáp án (một chữ A–E đơn lẻ vẫn bị coi là thiếu lựa chọn)
    if (!cur.opts.length && (m = RE_DAPAN_DIEN.exec(d)) && !/^[A-Ea-e]$/.test(m[1].trim())) { cur.dien = m[1].trim(); trangThai = 'da'; continue; }
    if ((m = RE_DAPAN.exec(d))) { cur.dung = m[1].toUpperCase(); trangThai = 'da'; continue; }
    if ((m = RE_GIAITHICH.exec(d))) { cur.gt = m[1]; trangThai = 'gt'; continue; }
    const lc = trangThai !== 'gt' ? tachLuaChon(d) : null;
    if (lc) {
      lc.forEach(o => {
        const bo = /\(\*\)\s*$/.test(o.t);
        cur.opts.push({ k: o.k, sao: o.sao || bo, t: o.t.replace(/\s*\(\*\)\s*$/, '') });
      });
      trangThai = 'lc'; continue;
    }
    if (trangThai === 'nd') cur.nd += '\n' + d;
    else if (trangThai === 'lc') cur.opts[cur.opts.length - 1].t += ' ' + d;
    else if (trangThai === 'gt') cur.gt += '\n' + d;
  }
  dong_cau();
  if (!ds.length && !loi.length) loi.push('Không nhận ra câu hỏi nào. Mỗi câu cần bắt đầu bằng "Câu 1." và có các lựa chọn A., B., C., D. cùng dòng "Đáp án: …".');
  return { ds, loi };
}

function phanTichJson(van) {
  const j = JSON.parse(van);
  const mang = Array.isArray(j) ? j : j.cauHoi;
  if (!Array.isArray(mang)) throw new Error('JSON phải là một mảng câu hỏi hoặc có khóa "cauHoi".');
  const ds = [], loi = [];
  mang.forEach((c, k) => {
    const dapAn = (c.dapAn || []).map(x => String(x).trim()).filter(Boolean);
    const dien = dapAn.length < 2 ? tachDien(c.dien) : [];
    if (c.nd && dien.length) { ds.push({ mon: c.mon, chuDe: c.chuDe, nd: c.nd, dapAn: [], dien, giaiThich: c.giaiThich, hinh: c.hinh, giaiHinh: c.giaiHinh }); return; }
    if (!c.nd || dapAn.length < 2 || !Number.isInteger(c.dung) || c.dung < 0 || c.dung >= dapAn.length) loi.push(`Phần tử ${k + 1}: thiếu nội dung, lựa chọn hoặc đáp án không hợp lệ.`);
    else ds.push({ mon: c.mon, chuDe: c.chuDe, nd: c.nd, dapAn, dung: c.dung, giaiThich: c.giaiThich, hinh: c.hinh, giaiHinh: c.giaiHinh });
  });
  return { ds, loi };
}

// Lấy chữ từ PDF (pdf.js): gom các mẩu chữ cùng độ cao thành một dòng, từ trên xuống dưới
const RE_SO_TRANG = /^\s*(?:trang|page)?\s*[-–]?\s*\d{1,3}\s*[-–]?(?:\s*\/\s*\d{1,3})?\s*$/i;
async function docPdf(file) {
  const P = await taiThuVien('pdfjs');
  let pdf;
  try { pdf = await P.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (err) { throw new Error('Không mở được file PDF (file hỏng hoặc đặt mật khẩu).'); }
  const tatCa = [];
  for (let t = 1; t <= pdf.numPages; t++) {
    const nd = await (await pdf.getPage(t)).getTextContent();
    const muc = nd.items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.transform[4], y: i.transform[5], r: i.width || 0, s: i.str }));
    muc.sort((a, b) => b.y - a.y || a.x - b.x);
    const dongTrang = [];
    let cur = null;
    for (const m of muc) {
      if (!cur || Math.abs(cur.y - m.y) > 3) { cur = { y: m.y, ds: [] }; dongTrang.push(cur); }
      cur.ds.push(m);
    }
    const chu = dongTrang.map(d => {
      d.ds.sort((a, b) => a.x - b.x);
      let s = '', cuoi = null;
      for (const m of d.ds) {
        if (cuoi != null && m.x - cuoi > 1.5 && !s.endsWith(' ') && !m.s.startsWith(' ')) s += ' ';
        s += m.s; cuoi = m.x + m.r;
      }
      return s.trim();
    }).filter(Boolean);
    // bỏ số trang ở đầu/cuối trang để không dính vào câu hỏi
    if (chu.length && RE_SO_TRANG.test(chu[chu.length - 1])) chu.pop();
    if (chu.length && RE_SO_TRANG.test(chu[0])) chu.shift();
    tatCa.push(...chu);
  }
  const van = tatCa.join('\n');
  if (van.replace(/\s/g, '').length < 20) throw new Error('PDF này là ảnh chụp/scan nên không có chữ để đọc. Hãy dùng PDF có thể bôi đen chữ, hoặc gõ lại vào Word/Excel.');
  return van;
}

async function docFile(file) {
  const duoi = (file.name.split('.').pop() || '').toLowerCase();
  let kq;
  if (['xlsx', 'xls', 'csv'].includes(duoi)) {
    const X = await taiThuVien('xlsx');
    const wb = duoi === 'csv' ? X.read(await file.text(), { type: 'string' }) : X.read(await file.arrayBuffer(), { type: 'array' });
    kq = { ds: [], loi: [] };
    wb.SheetNames.forEach(ten => {
      const r = phanTichBang(X.utils.sheet_to_json(wb.Sheets[ten], { header: 1, raw: false, defval: '' }), ten);
      kq.ds.push(...r.ds); kq.loi.push(...r.loi);
    });
  } else if (duoi === 'docx') {
    const M = await taiThuVien('mammoth');
    kq = phanTichVanBan((await M.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value);
  } else if (['txt', 'md'].includes(duoi)) {
    kq = phanTichVanBan(await file.text());
  } else if (duoi === 'json') {
    kq = phanTichJson(await file.text());
  } else if (duoi === 'pdf') {
    kq = phanTichVanBan(await docPdf(file));
    if (!kq.ds.length) kq.loi.push('Nếu file PDF chia hai cột hoặc có bảng, chữ có thể bị trộn lẫn khi đọc. Hãy thử xuất file sang Word (.docx) hoặc Excel rồi nhập lại.');
  } else if (duoi === 'doc') {
    throw new Error('File .doc cũ chưa được hỗ trợ. Hãy lưu lại thành .docx.');
  } else throw new Error('Định dạng .' + duoi + ' chưa được hỗ trợ.');
  kq.ds.forEach(c => { c.nguon = file.name; });
  return kq;
}

/* ============================================================
   Sao lưu & khôi phục
   ============================================================
   Một file JSON chứa dữ liệu của cả hai mục (CLC, TIMO): câu hỏi người dùng (kèm hình), lịch sử, thống kê từng câu
   (cũng là sổ câu sai), cài đặt và số câu mỗi ngày. Không đưa bài thi dở dang vào vì đồng hồ thi tính theo giờ tuyệt đối.
   File khôi phục không được tin: mọi giá trị đi qua lamSachKhoa() trước khi ghi vào localStorage. */
const RE_KHOA_LUU = /^(clc|timo)\.(cauHoi|lichSu|thongKe|cai|ngay)\.v1$/;
const KHOA_SAO_LUU = 'luyenthi.saoLuu';       // ngày giờ lần tải sao lưu gần nhất (không nằm trong file sao lưu)
const MUC_LUU = ['cauHoi', 'lichSu', 'thongKe', 'cai', 'ngay'];
const RE_ID_CAU = /^(?:mau-\d+|timo-mau-\d+|u[0-9a-z]{3,40})$/;
const so = (v, max = 1e9) => (Number.isFinite(v) && v >= 0 ? Math.min(v, max) : 0);
const khoaAnToan = k => typeof k === 'string' && k.length <= 60 && !['__proto__', 'constructor', 'prototype'].includes(k);

function lamSachKhoa(loai, v) {          // trả về giá trị đã làm sạch, hoặc null nếu sai cấu trúc
  const laObj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (loai === 'cauHoi') return Array.isArray(v) ? v.map(hopLeCau).filter(Boolean) : null;
  if (loai === 'lichSu') {
    if (!Array.isArray(v)) return null;
    return v.filter(e => laObj(e) && typeof e.id === 'string' && typeof e.ngay === 'string' && !isNaN(Date.parse(e.ngay)))
      .slice(-500).map(e => {
        const theoMon = {};
        if (laObj(e.theoMon)) Object.entries(e.theoMon).slice(0, 60).forEach(([m, x]) => { if (khoaAnToan(m) && laObj(x)) theoMon[m] = { dung: so(x.dung), tong: so(x.tong) }; });
        return { id: e.id.slice(0, 40), loai: e.loai === 'thi' ? 'thi' : 'luyen', ten: String(e.ten ?? '').slice(0, 120), ngay: e.ngay.slice(0, 40),
                 dung: so(e.dung), tong: so(e.tong), diem: so(e.diem), toiDa: so(e.toiDa) || 10, giay: so(e.giay), theoMon };
      });
  }
  if (loai === 'thongKe') {
    if (!laObj(v)) return null;
    const r = {};
    Object.entries(v).forEach(([id, o]) => {
      if (!RE_ID_CAU.test(id) || !laObj(o)) return;
      const x = { d: so(o.d), s: so(o.s), cuoi: o.cuoi === 'd' || o.cuoi === 's' ? o.cuoi : '' };
      if (Number.isInteger(o.h) && o.h >= 0 && o.h <= HOP_CUOI) x.h = o.h;
      if (typeof o.den === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.den)) x.den = o.den;
      r[id] = x;
    });
    return r;
  }
  if (loai === 'cai') return laObj(v) ? { ...(v.anMau === true ? { anMau: true } : {}), ...(Number.isInteger(v.mucTieu) && v.mucTieu >= 1 && v.mucTieu <= 500 ? { mucTieu: v.mucTieu } : {}) } : null;
  if (loai === 'ngay') {
    if (!laObj(v)) return null;
    const r = {};
    Object.entries(v).forEach(([k, o]) => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && laObj(o)) r[k] = { c: so(o.c, 1e5), d: so(o.d, 1e5), m: so(o.m, 500) || 10 }; });
    return r;
  }
  return null;
}

function taoSaoLuu() {
  const du = {};
  (kho ? Array.from({ length: kho.length }, (_, i) => kho.key(i)) : Object.keys(boNho)).forEach(k => {
    if (RE_KHOA_LUU.test(k)) { const v = doc(k, null); if (v != null) du[k] = v; }
  });
  return { app: 'luyen-thi-clc', phienBan: 1, ngay: new Date().toISOString(), duLieu: du };
}

// Đọc và kiểm tra file sao lưu; trả về dữ liệu đã làm sạch kèm tóm tắt từng mục để hiện trước khi khôi phục
function docSaoLuu(van) {
  let j; try { j = JSON.parse(van); } catch (e) { throw new Error('File không phải JSON hợp lệ.'); }
  if (!j || j.app !== 'luyen-thi-clc' || !j.duLieu || typeof j.duLieu !== 'object') throw new Error('Đây không phải file sao lưu của app này. (Để nhập riêng câu hỏi, hãy dùng Ngân hàng đề → Nhập từ file.)');
  const du = {};
  Object.entries(j.duLieu).forEach(([k, v]) => {
    const m = RE_KHOA_LUU.exec(k); if (!m) return;
    const s = lamSachKhoa(m[2], v); if (s != null) du[k] = s;
  });
  if (!Object.keys(du).length) throw new Error('File sao lưu không chứa dữ liệu nào dùng được.');
  const dem = (k, f) => (du[k] ? f(du[k]) : 0);
  const tomTat = ['clc', 'timo'].map(b => ({ bo: BO_DE[b].nhan,
    cau: dem(b + '.cauHoi.v1', a => a.length), luot: dem(b + '.lichSu.v1', a => a.length), ngay: dem(b + '.ngay.v1', o => Object.keys(o).length) }));
  return { du, tomTat, ngay: typeof j.ngay === 'string' ? j.ngay : '' };
}

// cheDo 'gop': giữ dữ liệu hiện có, thêm phần mới; 'thay': xóa dữ liệu hiện có rồi ghi bản sao lưu.
// Ghi lỗi giữa chừng (đầy bộ nhớ) thì trả lại nguyên trạng.
function khoiPhuc(du, cheDo) {
  if (!kho) throw new Error('Trình duyệt đang chặn lưu dữ liệu nên không khôi phục được.');
  const tatCa = ['clc.', 'timo.'].flatMap(tt => MUC_LUU.map(m => tt + m + '.v1'));
  const cu = Object.fromEntries(tatCa.map(k => [k, kho.getItem(k)]));
  const moi = {};
  ['clc.', 'timo.'].forEach(tt => {
    const k = m => tt + m + '.v1', mau = tt === 'timo.' ? CAU_TIMO : CAU_MAU;
    if (cheDo === 'thay') { MUC_LUU.forEach(m => { if (du[k(m)] != null) moi[k(m)] = du[k(m)]; else moi[k(m)] = null; }); return; }
    const hienCau = doc(k('cauHoi'), []), idMap = {}, themCau = [];
    const co = new Map(mau.concat(hienCau).map(q => [khoaTrung(q), q.id])), dung = new Set(hienCau.map(q => q.id));
    (du[k('cauHoi')] || []).forEach(q => {          // câu trùng nội dung với câu đã có thì dùng lại id cũ để thống kê gộp đúng chỗ
      const kt = khoaTrung(q);
      if (co.has(kt)) { idMap[q.id] = co.get(kt); return; }
      const id = dung.has(q.id) ? taoId() : q.id;
      idMap[q.id] = id; dung.add(id); co.set(kt, id); themCau.push({ ...q, id });
    });
    if (du[k('cauHoi')]) moi[k('cauHoi')] = hienCau.concat(themCau);
    if (du[k('thongKe')]) {
      const tk = doc(k('thongKe'), {});
      Object.entries(du[k('thongKe')]).forEach(([id, o]) => {
        const nid = idMap[id] ?? (/^(?:timo-)?mau-/.test(id) ? id : null);
        if (nid && (!tk[nid] || tk[nid].d + tk[nid].s < o.d + o.s)) tk[nid] = o;     // giữ bên có nhiều lịch sử hơn
      });
      moi[k('thongKe')] = tk;
    }
    if (du[k('lichSu')]) {
      const ls = doc(k('lichSu'), []), co2 = new Set(ls.map(e => e.id));
      moi[k('lichSu')] = ls.concat(du[k('lichSu')].filter(e => !co2.has(e.id))).sort((a, b) => Date.parse(a.ngay) - Date.parse(b.ngay)).slice(-500);
    }
    if (du[k('ngay')]) {
      const nk = doc(k('ngay'), {});
      Object.entries(du[k('ngay')]).forEach(([d, o]) => { if (!nk[d] || nk[d].c < o.c) nk[d] = o; });
      moi[k('ngay')] = nk;
    }
    if (du[k('cai')]) moi[k('cai')] = { ...du[k('cai')], ...doc(k('cai'), {}) };
  });
  try {
    Object.entries(moi).forEach(([k, v]) => { if (v == null) kho.removeItem(k); else kho.setItem(k, JSON.stringify(v)); });
  } catch (e) {
    Object.entries(cu).forEach(([k, v]) => { try { if (v == null) kho.removeItem(k); else kho.setItem(k, v); } catch (e2) { /* hết cách */ } });
    throw new Error('Không ghi được vì bộ nhớ trình duyệt không đủ chỗ. Dữ liệu hiện tại được giữ nguyên.');
  }
}

function canNhacSaoLuu() {
  if (!kho) return false;
  const coDL = cauNguoiDung().length > 0 || doc(KHOA.lichSu, []).length >= 3;
  const gan = Date.parse(kho.getItem(KHOA_SAO_LUU) || '');
  return coDL && !(gan && Date.now() - gan < 14 * 864e5);
}

function hopThoaiSaoLuu() {
  const tomTat = ['clc', 'timo'].map(b => `${BO_DE[b].nhan}: ${doc(BO_DE[b].tienTo + 'cauHoi.v1', []).length} câu bạn nhập, ${doc(BO_DE[b].tienTo + 'lichSu.v1', []).length} lượt làm bài`);
  const gan = kho && kho.getItem(KHOA_SAO_LUU);
  const inFile = h('input', { type: 'file', accept: '.json,application/json' });
  const xem = h('div'), loi = h('p', { style: 'color:var(--sai);margin:8px 0 0' });
  const nutKp = h('button', { class: 'btn', disabled: true }, 'Khôi phục');
  const radio = (v, nhan, mt, chon) => h('label', { style: 'display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer' },
    h('input', { type: 'radio', name: 'che-do-kp', value: v, checked: chon, style: 'margin-top:5px;accent-color:var(--nhan)' }), h('span', null, h('b', null, nhan), h('br'), h('span', { class: 'meta' }, mt)));
  const vungRadio = h('div', { style: 'display:none' }, radio('gop', 'Gộp', 'Giữ dữ liệu đang có và thêm phần chưa có (câu trùng được bỏ qua). Nên dùng khi chuyển từ máy khác sang.', true),
    radio('thay', 'Thay thế', 'Xóa toàn bộ dữ liệu hiện có của CLC và TIMO, chỉ giữ dữ liệu trong file.', false));
  const hop = moHop(
    h('h2', { style: 'font-size:1.2rem;margin-bottom:10px' }, 'Sao lưu & chuyển dữ liệu'),
    h('p', { class: 'meta' }, 'Câu hỏi bạn nhập (kèm hình), lịch sử, thống kê, sổ câu sai và mục tiêu hằng ngày chỉ nằm trong trình duyệt này. Xóa dữ liệu duyệt web hoặc đổi máy là mất. Hãy tải bản sao lưu để giữ an toàn hoặc chuyển sang máy khác (file chứa cả hai mục CLC và TIMO).'),
    h('ul', { class: 'meta', style: 'margin:6px 0 12px;padding-left:20px' }, tomTat.map(t => h('li', null, t))),
    h('div', { class: 'hang' },
      h('button', { class: 'btn', onclick: () => {
        const ngay = new Date(); const j = taoSaoLuu();
        taiXuong(`luyen-thi-sao-luu-${khoaNgay(ngay)}.json`, new Blob([JSON.stringify(j)], { type: 'application/json' }));
        if (kho) try { kho.setItem(KHOA_SAO_LUU, ngay.toISOString()); } catch (e) { /* bỏ qua */ }
        thongBao('Đã tải bản sao lưu về máy.');
      } }, 'Tải bản sao lưu (.json)'),
      gan ? h('span', { class: 'meta', style: 'margin:0' }, 'Lần sao lưu gần nhất: ' + ngayGio(gan)) : h('span', { class: 'meta', style: 'margin:0' }, 'Chưa sao lưu lần nào.')),
    h('hr', { style: 'border:0;border-top:1px solid var(--vien);margin:18px 0' }),
    h('h3', { style: 'font-size:1.05rem;margin-bottom:8px' }, 'Khôi phục từ bản sao lưu'),
    truong('Chọn file sao lưu (.json)', inFile),
    xem, vungRadio, loi,
    h('div', { class: 'hang', style: 'justify-content:flex-end;margin-top:14px' },
      h('button', { class: 'btn vien', onclick: () => hop.close() }, 'Đóng'), nutKp));
  let ketQua = null;
  inFile.addEventListener('change', async () => {
    ketQua = null; nutKp.disabled = true; vungRadio.style.display = 'none'; loi.textContent = ''; xem.replaceChildren();
    const f = inFile.files[0]; if (!f) return;
    try {
      if (f.size > 60e6) throw new Error('File quá lớn (tối đa 60 MB).');
      ketQua = docSaoLuu(await f.text());
      xem.replaceChildren(h('p', { class: 'meta' }, 'Bản sao lưu' + (ketQua.ngay ? ' tạo lúc ' + ngayGio(ketQua.ngay) : '') + ' gồm:'),
        h('ul', { class: 'meta', style: 'margin:4px 0 10px;padding-left:20px' }, ketQua.tomTat.map(t => h('li', null, `${t.bo}: ${t.cau} câu hỏi, ${t.luot} lượt làm bài, ${t.ngay} ngày có làm bài`))));
      vungRadio.style.display = ''; nutKp.disabled = false;
    } catch (err) { loi.textContent = err.message || 'Không đọc được file.'; }
  });
  nutKp.addEventListener('click', () => {
    const che = hop.querySelector('input[name=che-do-kp]:checked')?.value || 'gop';
    if (che === 'thay' && !confirm('Thay thế sẽ xóa toàn bộ dữ liệu hiện có (cả CLC và TIMO) và chỉ giữ dữ liệu trong file. Tiếp tục?')) return;
    try { khoiPhuc(ketQua.du, che); } catch (err) { loi.textContent = err.message; return; }
    hop.close(); di('trangchu'); thongBao(che === 'thay' ? 'Đã khôi phục dữ liệu từ bản sao lưu.' : 'Đã gộp dữ liệu từ bản sao lưu.');
  });
}

/* ============================================================
   Khởi động
   ============================================================ */
document.getElementById('nam').textContent = new Date().getFullYear();

// Chân trang: sao lưu dữ liệu và (nếu trình duyệt cho phép) cài như một ứng dụng
const nutChan = document.getElementById('chan-nut');
nutChan.style.marginBottom = '8px';
nutChan.append(h('button', { onclick: hopThoaiSaoLuu }, 'Sao lưu / khôi phục dữ liệu'));
let suKienCai = null;
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault(); suKienCai = ev;
  const khung = h('span', null, h('span', { class: 'cach' }, '|'), h('button', { onclick: async () => {
    if (!suKienCai) return;
    suKienCai.prompt(); await suKienCai.userChoice.catch(() => {}); suKienCai = null; khung.remove();
  } }, 'Cài đặt như ứng dụng'));
  nutChan.append(khung);
});
// Chạy offline: service worker chỉ hoạt động trên http(s) (không phải khi mở file trực tiếp)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* không bắt buộc */ });

// Áp dụng mục đang chọn: tên, màu chủ đạo, tiêu đề tab và nút chuyển mục
function ganBoDe() {
  const b = BO_DE[boDe];
  document.documentElement.dataset.bo = boDe;
  document.title = b.ten;
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', boDe === 'timo' ? '#282888' : '#0f52ba');
  document.getElementById('th-nhan').textContent = b.nhan;
  document.getElementById('th-ten').textContent = b.ten;
  document.getElementById('th-mota').textContent = b.khauHieu;
  document.querySelectorAll('#bode button').forEach(n => n.setAttribute('aria-pressed', String(n.dataset.bo === boDe)));
}
function doiBoDe(k) {
  if (k === boDe) return;
  dungDongHo();
  boDe = k;
  try { localStorage.setItem('luyenthi.boDe', k); } catch (e) { /* không lưu được thì bỏ qua */ }
  ganBoDe(); di('trangchu');
}
document.getElementById('bode').append(...Object.entries(BO_DE).map(([k, b]) => h('button', { 'data-bo': k, onclick: () => doiBoDe(k) }, b.nhan)));
ganBoDe();
const TRANG = { trangchu: trangChu, luyen: luyenCauHinh, on: onCauSai, thi: thiCauHinh, nganhang: nganHang, thongke: thongKe };
// Gộp tên trường gọi khác (ví dụ "Năng Khiếu" → "Năng Khiếu Sư Phạm") trong ngân hàng CLC đã lưu: đổi chủ đề, bỏ câu bị trùng hẳn với câu đã có.
function hopNhatTenTruong() {
  try {
    const khoa = 'clc.cauHoi.v1', ds = doc(khoa, []);
    if (!Array.isArray(ds)) return;
    const dau = new Set(ds.filter(q => q && truongDeCua(q) && chuDeChuan(q) === q.chuDe).map(khoaTrung)), ra = []; let doi = 0, bo = 0;
    ds.forEach(q => {
      if (!q || !truongDeCua(q) || chuDeChuan(q) === q.chuDe) { ra.push(q); return; }
      const c = { ...q, chuDe: chuDeChuan(q) }, k = khoaTrung(c);
      if (dau.has(k)) { bo++; return; }
      dau.add(k); ra.push(c); doi++;
    });
    if (doi || bo) { ghi(khoa, ra); }
  } catch (e) { /* không đọc được thì để nguyên */ }
}
khoSan.then(() => { hopNhatTenTruong(); di('trangchu'); });
